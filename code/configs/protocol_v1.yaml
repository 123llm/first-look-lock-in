# TPA-Reason frozen experimental protocol v1 (S4, 2026-11-01).
# Any change => protocol_v2.yaml + a change-log entry; never edit this file after its sha256 is recorded.
version: 1
frozen_on: "2026-11-01"
budget:
  gpu_hours_cap: 600
  estimate_script: code/scripts/s4_budget.py      # results/S4/budget_v1.json (602.4 GPU-h, Mini-o3/transfer costs ASSUMED)
  remeasure_at: [S6, S11]
  reduction_order: [E7, E2_mathvista, E8, E6, E4_mme]   # never reduce E3, E4 V*/HR-Bench-4K, E1 below 100 images
  gpu_sharing: wait_until_no_foreign_gpu_process        # never preempt or kill other projects' jobs

threat_model:
  norm: linf
  eps_main: 8            # /255
  eps_curve: [2, 4, 8, 16]
  eps_h2b_second: 4
  pixel_space: uint8     # final image = round(255*clip(x+delta))/255, saved as PNG; eps integer => linf_measured <= eps
  untargeted_main: true
  targeted_rule: lowest_clean_prob_wrong_option   # from final-answer letter distribution on the clean greedy trajectory
  targeted_scope: E8     # targeted results only on the E8 subset

attack:
  steps_T: 50
  step_size: eps/8       # alpha = eps/8 per step, sign gradient
  random_start: uniform  # delta_0 ~ U[-eps, eps]
  loss: ce_over_option_letters        # softmax restricted to the item's option letters; untargeted: maximise CE(gt)
  tpa:
    objective: EoSO
    trajectories_per_resample_M: {deepeyes_7b: 2, minio3_7b: 2, qwen3vl_4b_thinking: 1}
    resample_every_K: {deepeyes_7b: 10, minio3_7b: 10, qwen3vl_4b_thinking: 25}
    trajectory_sampling: official_sampling_params   # victim's own generation_config (temperature/top_p), seed = attack seed + resample index
    loss_weights: {final: 1.0, probe_lambda: 1.0}   # L = l_final + lambda * mean_t l_probe(t) ; probes after o_0 and every executed re-observation
    tf_window_tokens: 256        # truncated teacher forcing: keep last 256 reasoning tokens of each segment
    boxes: constant_within_sample
    grad_checkpointing: true
  single_view_pgd: {views: original_only, tool_context: none, same_T: true}
  eot_random_crop:
    crops_per_step: same_as_tpa_M
    box_area_frac: [0.05, 0.30]
    aspect: [0.5, 2.0]
    operator: victim_zoom_operator     # same differentiable S_b as TPA; only the box distribution and the trajectory conditioning differ
  mca_style_reimpl:
    surrogates: [clip-vit-b16, clip-vit-b32, clip-vit-l14]   # downloaded after S11 (models2)
    local_crop_scale: [0.5, 1.0]
    steps: 50
    note: "MCA-style (reimpl.), untargeted feature-push variant; not the official M-Attack-V2 numbers"
  reasonbreak: {type: official_generator_inference, license: MIT}
  attack_seed: 0

models:
  white_box: [deepeyes_7b, qwen3vl_4b_thinking]
  tool_models: [deepeyes_7b, minio3_7b, qwen3vl_4b_thinking]   # qwen3-thinking uses the DeepEyes tool prompt in tool mode
  transfer_eval: [minio3_7b, vision_r1_7b, vlaa_thinker_7b]
  controlled_pairs:        # E5 (same backbone); base model listed first
    - [qwen25vl_7b, deepeyes_7b]
    - [qwen25vl_7b, minio3_7b]
    - [qwen25vl_7b, vision_r1_7b]
    - [qwen25vl_7b, vlaa_thinker_7b]
    - [qwen3vl_4b_instruct, qwen3vl_4b_thinking]
    - [deepeyes_7b_tool_off, deepeyes_7b]
  quantization: {llm: nf4, vision_tower: bf16, skip_modules: [".*visual", ".*vision_tower", ".*multi_modal_projector", "lm_head"]}
  coord_mode: {qwen2.5: abs_resized, qwen3: rel1000}

decoding:
  main: greedy
  sampled_majority: {n: 3, seeds: [0, 1, 2], subset_frac: 0.10, params: official}
  max_new_tokens: {thinking: 4096, tool: 1024, instruct: 512}
  max_tool_turns: 6
  tool_off: {system_prompt: no_tool_description, max_turns: 1}
  invalid_status: [truncated, max_turns, unparsable]    # reported separately, never counted as attack success

parser:
  tool_mode: "<answer>\\s*\\(?([A-E])\\)?"                 # inside <answer>...</answer>
  thinking_mode: "after </think>: first standalone (?<![A-Za-z])([A-E])(?![A-Za-z]) or exact option text"
  boxed: "\\\\boxed\\{\\s*\\(?([A-E])\\)?"
  option_text_match: exact_casefold
  validation: {n_items: 200, required_acc: 0.99, step: S6}

option_shuffle: {rule: "numpy default_rng([0, crc32(question_id)]).permutation", applies_to: [vstar]}

metrics:
  denominator: clean_correct_greedy           # untargeted
  asr_source: free_generation_on_saved_png   # never teacher-forced logits (anti-coupling)
  probe_prefix: {tool: "<answer", thinking: "</think>\n\nThe answer is (", instruct: "The answer is ("}
  probes_used_for: [PFR, RFR, SRR, FSP]
  dbf:
    lexicon: [noise, noisy, artifact, artifacts, artefact, distorted, distortion, perturbed, perturbation,
              adversarial, corrupted, corruption, grainy, pixelated, pixelation, glitch, static, speckle, jpeg]
    rule: "flipped item AND adv trace matches lexicon (word-boundary, casefold) AND clean trace does not"
    manual_check: {n_items: 100, report: cohen_kappa, blind_to_condition: true}
  cir: {numerator: adv, denominator: clean, quantities: [generated_tokens, tool_calls], within_model_only: true}
  rg: executed_reobservations_per_trajectory
  veg: {intervention: random_box_same_size, seed: "crc32(question_id)", unit: clean_trajectory, outcome: final_answer_changed}

hypotheses:
  H1: {stat: kendall_tau_b, cells: "6 models x 4 attacks", support: "tau < 0.5 and bootstrap 95% CI upper < 0.7", also: "DbF 95% CI lower > 0 on >=1 reasoning model", alpha: 0.05}
  H1_judge:
    caption_prompt: "Describe this image in detail."
    judge: qwen3vl_8b_instruct     # text-only judging; fallback qwen3vl_4b_instruct if 8B unavailable
    judge_prompt_file: code/configs/prompts/h1_judge_v1.txt
    score: 1-10 similarity between clean and adversarial captions
    success_threshold: 5           # success if score <= 5 ; sensitivity 3 and 7
  H2a: {test: exact_mcnemar_paired_tool_on_vs_off, per_model: [deepeyes_7b, minio3_7b, qwen3vl_4b_thinking], data: [vstar, hrbench4k_eval200],
        support: "ASR_off - ASR_on >= 0.10 and Holm-adjusted p < 0.01 on >= 2 of 3 models", partial: "1 of 3"}
  H2b:
    gap: "|ASR_on - ASR_off| for TPA <= 0.05 (point) on each white-box model; 95% CI reported"
    vs_baselines: {eps8: [single_view_pgd, eot_random_crop, mca_style_reimpl], eps4: [single_view_pgd, eot_random_crop],
                   margin: 0.10, test: exact_mcnemar, holm_family: all_H2b_comparisons, alpha: 0.01}
    support: "all comparisons pass on both white-box models"
    partial: ">= half of the comparisons pass"
  H3:
    model: "logit P(success_ij) = b0 + b1*RG + b2*VEG + b3*RG:VEG + b4*z(log_cot_tokens) + model_fixed + (1|image)"
    fit: statsmodels BinomialBayesMixedGLM
    sensitivity: "GEE logit clustered by image, exchangeable"
    attack: single_view_pgd_transfer_from_base     # non-adaptive, same adversarial PNG for base and reasoning model
    support: "b3 < 0 with 95% CI excluding 0; b4 95% CI includes 0 or |OR per SD| < 1.2"
    intervention: "budget forcing lowers RG and raises success (paired McNemar, same direction)"
    descriptive: model_level_spearman_rho_with_pair_bootstrap
  H4:
    grid: {qwen3vl_4b_thinking: [[512, 1], [1536, 3], [4096, 6]], deepeyes_7b: [[1024, 1], [1024, 3], [1024, 6]], vision_r1_7b: [[256, 0], [768, 0], [2048, 0]]}
    nonadaptive: single_view_pgd images generated at default budget, evaluated at every budget
    adaptive: TPA re-run at each budget with T/2 steps (white-box models only)
    stat: "logistic slope of robustness on log budget; slope difference adaptive - nonadaptive"
    support: "nonadaptive slope > 0 (CI excludes 0) and slope difference CI excludes 0 (negative)"
    descriptive: spearman_rho

statistics:
  bootstrap: {B: 2000, seed: 0, cluster: image}
  paired_test: exact_mcnemar
  multiplicity: holm_within_hypothesis_family

data:
  splits_dir: code/configs/splits     # written in S5, sha256 recorded
  E_main: {vstar: 191, hrbench4k_eval: 200}
  hrbench4k_calib: 50                 # image-disjoint from eval; hyper-parameter checks only
  mme_rwlite_general: 150             # non-remote-sensing tasks, stratified by task
  mathvista_mc: 150
  e1_subset: {vstar: 50, hrbench4k_eval: 50}
  e4b_eps4: {vstar: 130}
  e6: {vstar: 100}
  e7: {mme_rwlite_rs: 100, xlrs_lite_mc: 100, vrsbench_yesno: 100}
  e8: {vstar: 25, hrbench4k_eval: 25}
  sampling_seed: 0
  visualprobe: qualitative_only
  nips17: not_used

isolation:
  tune_only_on: hrbench4k_calib
  pilot_S11: "V* 50 + HR-Bench 4K 50 from eval; go/no-go only, no hyper-parameter selection"
  attacks_must_not_import: tpa.metrics

results:
  path: "results/raw/<E_id>/<dataset>__<model>__<method>__eps<k>__seed<s>.jsonl"
  meta: [git_commit, protocol_sha256, model_revisions, split_sha256, cmdline]
  validator: code/scripts/validate_results.py
